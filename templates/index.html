<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Busca de Frota - Nevada</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    
    <!-- Configurações de Aplicativo (PWA) -->
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <meta name="theme-color" content="#0056b3">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Nevada">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='logo.png') }}">
</head>
<body>
    <div class="container" style="text-align: center; padding: 20px;">
        <h2>🔎 Consulta de Veículo</h2>
        
        {% if erro %}
        <div style="background-color: #f8d7da; color: #721c24; padding: 10px; border-radius: 5px; margin-bottom: 15px; font-weight: bold;">
            {{ erro }}
        </div>
        {% endif %}

        <form id="formBusca" action="/buscar" method="POST" style="margin-top: 20px;">
            <input type="text" name="placa" placeholder="Digite a placa" required 
                   style="width: 100%; padding: 15px; margin-bottom: 15px; border: 2px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 18px; text-transform: uppercase; text-align: center;">
            
            <button type="submit" id="btnBuscar" 
                    style="width: 100%; padding: 15px; background-color: #0056b3; color: white; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.3s;">
                Buscar Veículo
            </button>
        </form>
    </div>

    <!-- Script do Botão Inteligente -->
    <script>
        document.getElementById('formBusca').addEventListener('submit', function() {
            var btn = document.getElementById('btnBuscar');
            // Muda o texto
            btn.innerHTML = 'Buscando... ⏳';
            // Muda a cor para cinza para indicar que está inativo
            btn.style.backgroundColor = '#6c757d';
            // Remove o cursor de clique e impede que a pessoa clique de novo
            btn.style.pointerEvents = 'none';
        });
    </script>
</body>
</html>
