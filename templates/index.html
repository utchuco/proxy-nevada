<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Busca de Frota - Nevada</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    
    <!-- Configurações de Aplicativo (PWA) -->
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <meta name="theme-color" content="#0056b3">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Nevada">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='logo.png') }}">
</head>
<body>
    <div class="container" style="text-align: center; padding: 20px;">
        <h2>🔎 Consulta de Veículo</h2>
        
        {% if erro %}
        <div style="background-color: #f8d7da; color: #721c24; padding: 10px; border-radius: 5px; margin-bottom: 15px; font-weight: bold;">
            {{ erro }}
        </div>
        {% endif %}

        <form id="formBusca" action="/buscar" method="POST" style="margin-top: 20px;">
            <!-- Input otimizado com autocapitalize e sem autocomplete -->
            <input type="text" id="inputPlaca" name="placa" placeholder="ABC-1234" required 
                   autocapitalize="characters" autocomplete="off" spellcheck="false" maxlength="8"
                   style="width: 100%; padding: 15px; margin-bottom: 15px; border: 2px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 22px; font-weight: bold; text-transform: uppercase; text-align: center; letter-spacing: 2px;">
            
            <button type="submit" id="btnBuscar" 
                    style="width: 100%; padding: 15px; background-color: #0056b3; color: white; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.3s;">
                Buscar Veículo
            </button>
        </form>
    </div>

    <script>
        // Máscara Automática da Placa
        document.getElementById('inputPlaca').addEventListener('input', function (e) {
            var valor = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
            if (valor.length > 3) {
                valor = valor.substring(0, 3) + '-' + valor.substring(3, 7);
            }
            e.target.value = valor;
        });

        // Botão Inteligente (Loading)
        document.getElementById('formBusca').addEventListener('submit', function() {
            var btn = document.getElementById('btnBuscar');
            btn.innerHTML = 'Buscando... ⏳';
            btn.style.backgroundColor = '#6c757d';
            btn.style.pointerEvents = 'none';
        });
    </script>
</body>
</html>
