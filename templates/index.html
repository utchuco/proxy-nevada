<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de Frota - Locadora Nevada</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Nevada">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='logo.png') }}">
</head>
<body>
    <div class="main-wrapper">
        <div class="brand-header">
            <img src="{{ url_for('static', filename='logo.png') }}" alt="Locadora Nevada" class="brand-logo" onerror="this.style.display='none'">
            <div>
                <span class="brand-badge">Portal do Condutor</span>
            </div>
        </div>

        <div class="card-container card-search">
            <h2 style="font-size: 1.25rem; font-weight: 800; color: #0f172a; margin-bottom: 6px; text-align: center;">
                Consultar Veículo
            </h2>
            <p style="font-size: 0.85rem; color: #64748b; margin-bottom: 20px; text-align: center;">
                Digite a placa para acessar checklist, CRLV e carro reserva
            </p>

            {% if erro %}
            <div style="background-color: #fef2f2; border: 1px solid #fecaca; border-left: 4px solid #ef4444; border-radius: 8px; padding: 12px 14px; margin-bottom: 16px; font-size: 0.85rem; color: #991b1b; font-weight: 600; text-align: left;">
                {{ erro }}
            </div>
            {% endif %}

            <form id="formBusca" action="/buscar" method="POST">
                <div class="input-placa-wrapper">
                    <input type="text" id="inputPlaca" name="placa" placeholder="ABC-1234" required 
                           autocapitalize="characters" autocomplete="off" spellcheck="false" maxlength="8"
                           class="input-placa">
                    
                    <ul id="listaSugestoes" class="suggestions-list" style="display: none;">
                    </ul>
                </div>

                <button type="submit" id="btnBuscar" class="btn-primary">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <span>Localizar Veículo</span>
                </button>
            </form>
        </div>

        <p style="text-align: center; font-size: 0.75rem; color: #94a3b8; font-weight: 500;">
            Locadora Nevada &bull; Gestão Inteligente de Frotas
        </p>
    </div>

    <script>
        const inputPlaca = document.getElementById('inputPlaca');
        const listaSugestoes = document.getElementById('listaSugestoes');
        let timeoutBusca = null;

        inputPlaca.addEventListener('input', function (e) {
            var valor = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
            if (valor.length > 3) {
                valor = valor.substring(0, 3) + '-' + valor.substring(3, 7);
            }
            e.target.value = valor;

            clearTimeout(timeoutBusca);

            if (valor.replace('-', '').length >= 3) { 
                timeoutBusca = setTimeout(async function() {
                    try {
                        const response = await fetch('/api/veiculos/sugestoes?q=' + valor);
                        const data = await response.json();
                        
                        listaSugestoes.innerHTML = '';
                        
                        if (data.placas && data.placas.length > 0) {
                            listaSugestoes.style.display = 'block';
                            
                            data.placas.forEach(placa => {
                                let li = document.createElement('li');
                                li.className = 'suggestion-item';
                                li.innerHTML = '<span>' + placa + '</span><span style="font-size: 0.75rem; color: #94a3b8; font-weight: 500;">Selecionar</span>';
                                
                                li.onmousedown = function(event) {
                                    event.preventDefault(); 
                                };
                                
                                li.onclick = function() {
                                    inputPlaca.value = placa; 
                                    listaSugestoes.style.display = 'none'; 
                                    document.getElementById('btnBuscar').click(); 
                                };
                                
                                listaSugestoes.appendChild(li);
                            });
                        } else {
                            listaSugestoes.style.display = 'none';
                        }
                    } catch (err) {
                        console.error("Erro ao buscar sugestões", err);
                    }
                }, 250);
            } else {
                listaSugestoes.style.display = 'none';
            }
        });

        document.addEventListener('click', function(e) {
            if (e.target !== inputPlaca) {
                listaSugestoes.style.display = 'none';
            }
        });

        document.getElementById('formBusca').addEventListener('submit', function() {
            var btn = document.getElementById('btnBuscar');
            btn.innerHTML = '<span>Consultando...</span>';
            btn.style.backgroundColor = '#475569';
            btn.style.pointerEvents = 'none';
        });
    </script>
</body>
</html>
