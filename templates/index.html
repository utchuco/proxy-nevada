<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nevada - Consulta de Frota</title>
    <!-- Configurações de Aplicativo (PWA) -->
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <meta name="theme-color" content="#0056b3">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Nevada">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='logo.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h2>Locadora Nevada</h2>
        <p>Digite a placa do veículo para consultar o cliente e checklists ativos.</p>
        
        <!-- Visor de Erros -->
        {% if erro %}
            <div style="background-color: #ffdddd; color: #cc0000; padding: 10px; margin-bottom: 15px; border-radius: 5px;">
                <strong>Atenção:</strong> {{ erro }}
            </div>
        {% endif %}

        <form action="/buscar" method="POST">
            <input type="text" name="placa" placeholder="EX: ABC-1234" required>
            <button type="submit">Buscar Veículo</button>
        </form>
    </div>
</body>
</html>
