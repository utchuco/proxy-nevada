<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frota - Nevada</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container" style="text-align: center; padding: 20px;">
        <h2>📋 Frota Blue Fleet</h2>
        
        <div style="text-align: left;">
            {% if veiculos %}
                {% for v in veiculos %}
                <div style="background: #f9f9f9; padding: 15px; border-radius: 8px; margin-bottom: 10px; border-left: 5px solid #0056b3;">
                    <h3 style="margin: 0 0 5px 0; color: #0056b3;">{{ v.licensePlate }}</h3>
                    <p style="margin: 0;"><strong>Modelo:</strong> {{ v.vehicleModelName }}</p>
                    <p style="margin: 0;"><strong>Status:</strong> {{ v.vehicleStatusName }}</p>
                </div>
                {% endfor %}
            {% else %}
                <p>Nenhum veículo encontrado.</p>
            {% endif %}
        </div>

        <a href="/" style="display: inline-block; margin-top: 20px; padding: 10px 20px; background-color: #6c757d; color: white; text-decoration: none; border-radius: 5px; font-weight: bold; width: 100%; box-sizing: border-box;">Voltar</a>
    </div>
</body>
</html>
