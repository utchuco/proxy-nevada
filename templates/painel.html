<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Painel de Aprovação - Nevada Frota</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
    .container { max-width: 1000px; margin: 0 auto; }
    h1 { font-size: 24px; margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between; }
    .badge { background: #3b82f6; font-size: 14px; padding: 4px 10px; border-radius: 9999px; }
    .grid { display: grid; gap: 20px; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.2); }
    .card-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 12px; margin-bottom: 16px; }
    .placa-badge { background: #f59e0b; color: #000; font-weight: bold; font-size: 18px; padding: 4px 12px; border-radius: 6px; }
    .tipo-badge { font-size: 12px; padding: 4px 8px; border-radius: 4px; text-transform: uppercase; font-weight: bold; }
    .alugado { background: #6366f1; color: #fff; }
    .patio { background: #10b981; color: #fff; }
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-bottom: 16px; }
    .form-group { display: flex; flex-direction: column; }
    .form-group.full { grid-column: 1 / -1; }
    label { font-size: 12px; color: #94a3b8; margin-bottom: 4px; font-weight: 500; }
    input, select, textarea { background: #0f172a; border: 1px solid #475569; color: #f8fafc; border-radius: 6px; padding: 8px 10px; font-size: 14px; }
    input:focus, select:focus, textarea:focus { border-color: #38bdf8; outline: none; }
    textarea { resize: vertical; min-height: 60px; }
    .actions { display: flex; gap: 10px; justify-content: flex-end; }
    button { padding: 10px 18px; border-radius: 6px; border: none; font-size: 14px; font-weight: 600; cursor: pointer; transition: 0.2s; }
    .btn-approve { background: #10b981; color: #fff; }
    .btn-approve:hover { background: #059669; }
    .btn-reject { background: #ef4444; color: #fff; }
    .btn-reject:hover { background: #dc2626; }
    .empty { text-align: center; color: #64748b; padding: 50px 0; }
  </style>
</head>
<body>
  <div class="container">
    <h1>
      Pendências de Manutenção
      <span class="badge">{{ checklists|length }} pendentes</span>
    </h1>

    {% if not checklists %}
      <div class="card empty">
        <h2>Tudo em dia!</h2>
        <p>Nenhum checklist aguardando aprovação no momento.</p>
      </div>
    {% else %}
      <div class="grid">
        {% for c in checklists %}
        <div class="card" id="card-{{ c.id }}">
          <div class="card-header">
            <span class="placa-badge">{{ c.placa }}</span>
            <span class="tipo-badge {% if c.tipo_veiculo == 'alugado' %}alugado{% else %}patio{% endif %}">
              {{ c.tipo_veiculo }}
            </span>
          </div>

          <form id="form-{{ c.id }}">
            <div class="form-grid">
              <div class="form-group">
                <label>Placa</label>
                <input type="text" name="placa" value="{{ c.placa }}">
              </div>

              <div class="form-group">
                <label>KM Atual</label>
                <input type="number" name="km_atual" value="{{ c.km_atual }}">
              </div>

              <div class="form-group">
                <label>Tipo de Ocorrência</label>
                <select name="motivo_id">
                  <option value="2" {% if c.motivo_id|string == "2" or c.motivo_id|string != "1" %}selected{% endif %}>Corretiva (Falha Mecânica)</option>
                  <option value="1" {% if c.motivo_id|string == "1" %}selected{% endif %}>Preventiva (Revisão Periódica/KM)</option>
                </select>
              </div>

              <div class="form-group">
                <label>Data/Hora Chegada e Agendamento</label>
                <input type="datetime-local" name="data_agendamento" value="{{ c.data_agendamento_local }}">
              </div>

              <div class="form-group">
                <label>Solicitante</label>
                <input type="text" name="solicitante" value="{{ c.solicitante or 'Equipe Nevada' }}">
              </div>

              <div class="form-group">
                <label>Telefone</label>
                <input type="text" name="telefone" value="{{ c.telefone or '11999999999' }}">
              </div>

              <div class="form-group">
                <label>E-mail</label>
                <input type="email" name="email" value="{{ c.email or 'frota@locadoranevada.com.br' }}">
              </div>

              <div class="form-group full">
                <label>Descrição do Problema / Serviço</label>
                <textarea name="descricao">{{ c.descricao }}</textarea>
              </div>
            </div>

            <div class="actions">
              <button type="button" class="btn-reject" onclick="descartar('{{ c.id }}')">Descartar</button>
              <button type="button" class="btn-approve" onclick="aprovar('{{ c.id }}')">Salvar e Enviar Blue Fleet</button>
            </div>
          </form>
        </div>
        {% endfor %}
      </div>
    {% endif %}
  </div>

  <script>
    async function descartar(id) {
      if (!confirm("Deseja realmente descartar este checklist?")) return;
      const r = await fetch(`/painel/descartar/${id}`, { method: "POST" });
      const res = await r.json();
      if (res.sucesso) {
        document.getElementById(`card-${id}`).remove();
        location.reload();
      } else {
        alert("Erro: " + res.erro);
      }
    }

    async function aprovar(id) {
      const form = document.getElementById(`form-${id}`);
      const data = Object.fromEntries(new FormData(form).entries());

      const btn = form.querySelector(".btn-approve");
      btn.disabled = true;
      btn.innerText = "Enviando...";

      try {
        const r = await fetch(`/painel/aprovar/${id}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data)
        });
        const res = await r.json();
        if (res.sucesso) {
          alert(`Sucesso! Ocorrência criada na Blue Fleet: ID ${res.contractItemRequestId}`);
          document.getElementById(`card-${id}`).remove();
          location.reload();
        } else {
          alert("Blue Fleet recusou: " + JSON.stringify(res.detalhes || res.erro));
          btn.disabled = false;
          btn.innerText = "Salvar e Enviar Blue Fleet";
        }
      } catch (err) {
        alert("Erro de comunicação com o servidor: " + err);
        btn.disabled = false;
        btn.innerText = "Salvar e Enviar Blue Fleet";
      }
    }
  </script>
</body>
</html>
